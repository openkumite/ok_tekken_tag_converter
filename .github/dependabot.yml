# Dependabot version updates: one grouped pull request a week per ecosystem; CI checks each one.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # pinned on purpose: the float maths' sin / cos / fma; an update could change the converters' output (the fingerprint)
      - dependency-name: libm
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
